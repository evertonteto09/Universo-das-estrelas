<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apostar - Felipa Patroa</title>

    <link rel="stylesheet" href="../assets/css/felipa.css">

    <link rel="stylesheet" href="../assets/css/aposta.css">

</head>


<body>

    <header class="header-teste">

    <a href="felipa.html" class="voltar">
        ← Voltar
    </a>

    </header>


    <main class="pagina-aposta">


        <section class="teste-container">


            <div class="cabecalho">

                <h1 class="titulo">🎰 Teste o Apostar</h1>

                <p>
                    Arrisque suas moedas e descubra se a sorte está do seu lado!
                </p>

            </div>



            <div class="aposta-card">


                <div class="saldo">

                    <span>💰 Seu saldo</span>

                    <strong id="saldo">1.000</strong>

                    <small>moedas</small>

                </div>



                <div class="aposta-conteudo">


                    <label for="valorAposta">

                        💵 Valor da aposta

                    </label>


                    <input
                        type="number"
                        id="valorAposta"
                        min="1"
                        placeholder="Digite o valor"
                    >


                    <p class="limite">

                        Aposte entre 1 e <span id="saldoLimite">1.000</span> moedas.

                    </p>



                    <button id="botaoApostar">

                        🎰 Apostar

                    </button>


                </div>


            </div>



            <section class="resultado-area">


                <div class="discord-mensagem">


                    <div class="bot-avatar">

                        <img
                            src="../assets/images/felipa.png"
                            class="icon"
                            alt="Felipa Patroa"
                        >

                    </div>



                    <div class="mensagem-conteudo">


                        <div class="bot-nome">

                            Felipa Patroa

                            <span class="app">

                                APP

                            </span>

                        </div>



                        <div id="resultado">

                            🎰 Faça uma aposta para descobrir
                            se a sorte está do seu lado...

                        </div>


                    </div>


                </div>


            </section>


        </section>


    </main>


    <script src="../assets/js/tema-pages.js"></script>

    <script src="../assets/js/aposta.js"></script>

</body>

</html>
