<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Andamento Twitch - Sophia Streaming</title>

    <link rel="stylesheet" href="../assets/css/sophia.css">

    <link rel="stylesheet" href="../assets/css/andamento.css">

</head>


<body>

    <header class="header-teste">

    <a href="sophia.html" class="voltar">
        ← Voltar
    </a>

    </header>


    <main class="pagina-andamento">


        <section class="teste-container">


            <div class="cabecalho">

                <h1 class="titulo">
                    📊 Andamento da Twitch
                </h1>

                <p>
                    Veja como estaria o painel do seu canal na Twitch.
                </p>

            </div>


            <div class="andamento-card">


                <div class="icone-andamento">
                    📺
                </div>


                <h2>
                    Consulte seu canal
                </h2>


                <p>
                    Preencha as informações abaixo para gerar
                    o painel do seu canal.
                </p>


                <div class="campos">


                    <div class="campo">

                        <label for="nomeCanal">
                            📺 Nome do canal
                        </label>

                        <input
                            type="text"
                            id="nomeCanal"
                            placeholder="Exemplo: Meu Canal"
                        >

                    </div>


                    <div class="campo">

                        <label for="inscritos">
                            👥 Seguidores
                        </label>

                        <input
                            type="number"
                            id="inscritos"
                            placeholder="Exemplo: 14743"
                            min="0"
                        >

                    </div>


                    <div class="campo">

                        <label for="views">
                            👁️ Visualizações
                        </label>

                        <input
                            type="number"
                            id="views"
                            placeholder="Exemplo: 302281"
                            min="0"
                        >

                    </div>


                    <div class="campo">

                        <label for="icone">
                            🖼️ URL do ícone
                        </label>

                        <input
                            type="url"
                            id="icone"
                            placeholder="https://..."
                        >

                    </div>


                </div>


                <button id="botaoAndamento">

                    📊 Ver andamento

                </button>


            </div>


            <section
                id="resultadoArea"
                class="resultado-area escondido"
            >


                <div class="discord-mensagem">


                    <div class="bot-avatar">

                        <img
                            src="../assets/images/sophia.png"
                            class="icon"
                            alt="Sophia Streaming"
                        >

                    </div>


                    <div class="mensagem-conteudo">


                        <div class="bot-nome">

                            Sophia Streaming

                            <span class="app">
                                APP
                            </span>

                        </div>


                        <div class="resultado">


                            <h3>
                                📺 Seu Canal na Twitch
                            </h3>


                            <p>
                                Aqui está o andamento do seu canal.
                            </p>


                            <div class="imagem-resultado">

                                <img
                                    id="imagemTwitch"
                                    alt="Andamento do canal na Twitch"
                                >

                            </div>


                        </div>


                    </div>


                </div>


            </section>


        </section>


    </main>


    <script src="../assets/js/tema-pages.js"></script>

    <script src="../assets/js/andamento.js"></script>

</body>

</html>
