<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube - Sophia Streaming</title>

    <link rel="stylesheet" href="../assets/css/sophia.css">

    <link rel="stylesheet" href="../assets/css/estatisticas.css">

</head>


<body>

    <header class="header-teste">

    <a href="sophia.html" class="voltar">
        ← Voltar
    </a>

    </header>


    <main class="pagina-youtube">


        <section class="teste-container">


            <div class="cabecalho">

                <h1 class="titulo">
                    ▶️ Seu Canal no YouTube
                </h1>

                <p>
                    Veja como ficaria o painel do seu canal!
                </p>

            </div>


            <div class="youtube-card">


                <div class="icone-youtube">
                    ▶️
                </div>


                <h2>
                    Consulte seu canal
                </h2>


                <p>
                    Preencha as informações do seu canal
                    para gerar o painel.
                </p>


                <div class="campos">


                    <div class="campo">

                        <label for="nomeCanal">
                            📺 Nome do canal
                        </label>

                        <input
                            type="text"
                            id="nomeCanal"
                            placeholder="Exemplo: Tomzim gameplays"
                        >

                    </div>


                    <div class="campo">

                        <label for="likes">
                            👍 Likes
                        </label>

                        <input
                            type="number"
                            id="likes"
                            placeholder="Exemplo: 6113"
                            min="0"
                        >

                    </div>


                    <div class="campo">

                        <label for="inscritos">
                            👥 Inscritos
                        </label>

                        <input
                            type="number"
                            id="inscritos"
                            placeholder="Exemplo: 14053"
                            min="0"
                        >

                    </div>


                    <div class="campo">

                        <label for="views">
                            👁️ Visualizações
                        </label>

                        <input
                            type="number"
                            id="views"
                            placeholder="Exemplo: 324367"
                            min="0"
                        >

                    </div>


                    <div class="campo">

                        <label for="icone">
                            🖼️ URL do ícone
                        </label>

                        <input
                            type="url"
                            id="icone"
                            placeholder="https://..."
                        >

                    </div>


                </div>


                <button id="botaoYoutube">

                    ▶️ Ver meu canal

                </button>


            </div>


            <section
                id="resultadoArea"
                class="resultado-area escondido"
            >


                <div class="discord-mensagem">


                    <div class="bot-avatar">

                        <img
                            src="../assets/images/sophia.png"
                            class="icon"
                            alt="Sophia Streaming"
                        >

                    </div>


                    <div class="mensagem-conteudo">


                        <div class="bot-nome">

                            Sophia Streaming

                            <span class="app">
                                APP
                            </span>

                        </div>


                        <div class="resultado">


                            <h3>
                                ▶️ Seu Canal no YouTube
                            </h3>


                            <p>
                                Aqui está o andamento do seu canal.
                            </p>


                            <div class="imagem-resultado">

                                <img
                                    id="imagemYoutube"
                                    alt="Painel do canal no YouTube"
                                >

                            </div>


                        </div>


                    </div>


                </div>


            </section>


        </section>


    </main>


    <script src="../assets/js/tema-pages.js"></script>

    <script src="../assets/js/estatisticas.js"></script>

</body>

</html>
