<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teste Ship - Felipe Patrão</title>

    <link rel="stylesheet" href="../assets/css/ship.css">

    <link rel="stylesheet" href="../assets/css/felipe.css">

</head>


<body>


<header>

    <a href="felipe.html"
       class="voltar-teste">

        ← Voltar

    </a>

</header>


<main>


<section class="teste-comando">


    <h1>💖 Teste o Ship</h1>


    <p class="descricao-teste">

        Descubra a compatibilidade entre duas pessoas!

    </p>



    <div class="ship-card">


        <div class="pessoas-ship">


            <div class="pessoa">


                <label for="nome1">

                    👤 Primeira pessoa

                </label>


                <input

                    type="text"

                    id="nome1"

                    placeholder="Nome"

                    class="label"

                >


                <input

                    type="url"

                    id="avatar1"

                    placeholder="URL do avatar"

                    class="label"

                >


            </div>



            <div class="coracao">

                💔

            </div>



            <div class="pessoa">


                <label for="nome2">

                    👤 Segunda pessoa

                </label>


                <input

                    type="text"

                    id="nome2"

                    placeholder="Nome"

                    class="label"

                >


                <input

                    type="url"

                    id="avatar2"

                    placeholder="URL do avatar"

                    class="label"

                >


            </div>


        </div>



        <button id="calcularShip">

            💖 Calcular Ship

        </button>



        <div id="resultadoShip">

        </div>


    </div>


</section>


</main>

<script src="../assets/js/tema-pages.js"></script>

<script src="../assets/js/ship.js"></script>

</body>

</html>
